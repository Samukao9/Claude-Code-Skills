<svg class="fig" viewBox="0 0 600 218" role="img" aria-label="Diagrama de caminhos: efeito direto da educação e caminho indireto pela habilidade" xmlns="http://www.w3.org/2000/svg">
<rect class="nb" x="32" y="128" width="116" height="44" rx="10"/><text class="an" x="90" y="155" text-anchor="middle" font-weight="700">educ</text>
<rect class="nb" x="452" y="128" width="116" height="44" rx="10"/><text class="an" x="510" y="155" text-anchor="middle" font-weight="700">salário</text>
<rect class="ng" x="242" y="28" width="116" height="44" rx="10"/><text class="an" x="300" y="55" text-anchor="middle" font-weight="700">hab</text>
<line class="arw" x1="150" y1="150" x2="441" y2="150"/><polygon class="arwh" points="450,150 441,145.9 441,154.1"/>
<line class="arw" x1="140" y1="130" x2="234.3" y2="72.7"/><polygon class="arwh" points="242,68 232.2,69.2 236.4,76.1"/>
<line class="arw" x1="358" y1="68" x2="452.3" y2="125.3"/><polygon class="arwh" points="460,130 454.4,121.9 450.2,128.8"/>
<text class="an fitc" x="300" y="170" text-anchor="middle">β₁ = 1 (efeito direto, com hab fixa)</text>
<text class="an" x="170" y="92" text-anchor="end">δ₁ = 0,9</text>
<text class="an" x="428" y="92">β₂ = 2</text>
<text class="an resc" x="300" y="206" text-anchor="middle">a regressão simples mede os dois caminhos juntos: 1 + 2 × 0,9 = 2,8</text>
</svg>