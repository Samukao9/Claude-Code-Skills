<svg class="fig mini" viewBox="0 0 240 140" role="img" aria-label="Barra da variação total dividida em parte explicada e resíduos; o R-quadrado é a parte azul" xmlns="http://www.w3.org/2000/svg">
<text class="an sm" x="12" y="22" text-anchor="start" font-weight="700">SQT = toda a variação de y</text><rect class="barA" x="12" y="32" width="199.8" height="34" rx="3"/><rect class="sqr" x="211.8" y="32" width="16.2" height="34" rx="3"/><text class="an sm" x="110" y="54" text-anchor="middle">SQE (explicada)</text><text class="an sm resc" x="228" y="82" text-anchor="end">SQR (resíduos) ↑</text><text class="an sm fitc" x="12" y="106" text-anchor="start">R² = SQE / SQT = parte azul</text><text class="an sm" x="12" y="124" text-anchor="start">ex.: 52,9 / 57,2 = 0,925</text>
</svg>